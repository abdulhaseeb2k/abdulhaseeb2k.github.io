name: Daily site data update

on:
  schedule:
    # 03:00 UTC = 08:00 Pakistan time, rozana
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # manual run button bhi milega (Actions tab mein)
  push:
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_data.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
            git push
          fi
